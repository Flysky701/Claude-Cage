plugins { id 'com.android.application' }
android {
    namespace 'io.github.flysky701.cage.open'
    compileSdk 36
    buildToolsVersion '36.1.0'
    defaultConfig {
        applicationId 'io.github.flysky701.cage.open'
        minSdk 28
        targetSdk 28
        versionCode 2
        versionName '0.0.2-bundled-preview'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress += 'apk' }
}
dependencies { implementation project(':Bcore') }
