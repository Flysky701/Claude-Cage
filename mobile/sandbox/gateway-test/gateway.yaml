mode: rule
log-level: warning
ipv6: false
allow-lan: false
find-process-mode: off
profile:
  store-selected: false
dns:
  enable: true
  listen: 192.0.2.1:53
  ipv6: false
  enhanced-mode: redir-host
  use-hosts: false
  use-system-hosts: false
  prefer-h3: false
  nameserver:
    - "https://1.1.1.1/dns-query#CageUp"
tun:
  enable: true
  device: cage-tun
  stack: gvisor
  auto-route: false
  auto-detect-interface: false
  inet4-address: [198.18.0.1/30]
proxies:
  - name: CageUp
    type: socks5
    server: 198.51.100.2
    port: 1080
    udp: false
rules:
  - NETWORK,UDP,REJECT
  - IP-CIDR,198.51.100.0/30,REJECT,no-resolve
  - IP-CIDR,203.0.113.17/32,REJECT,no-resolve
  - MATCH,CageUp
